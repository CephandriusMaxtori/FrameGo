<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>FrameGo Kiosk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; }

    #frame { max-width: 100vw; max-height: 100vh; object-fit: contain; }

    /* Overlay panel */
    #overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #overlay.visible { opacity: 1; pointer-events: auto; }

    .panel {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 16px;
      padding: 24px;
      width: min(360px, 90vw);
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .panel-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 18px; font-weight: 600; color: #f1f5f9;
      text-align: center;
    }

    .panel-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%; min-height: 52px;
      padding: 12px 16px;
      border-radius: 12px; border: 1px solid rgba(51, 65, 85, 0.5);
      background: rgba(30, 41, 59, 0.8);
      color: #e2e8f0;
      font-family: inherit; font-size: 15px; font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .panel-btn:active { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.4); transform: scale(0.98); }
    .panel-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .panel-btn.danger { color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
    .panel-btn.danger:active { background: rgba(239, 68, 68, 0.15); }

    .panel-status {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 200px; overflow-y: auto;
    }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #94a3b8;
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .status-dot.active { background: #34d399; box-shadow: 0 0 6px rgba(52, 211, 153, 0.5); }
    .status-dot.faulted { background: #ef4444; }
    .status-dot.suspended { background: #64748b; }

    .panel-close {
      position: absolute; top: 16px; right: 16px;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(51, 65, 85, 0.5);
      background: rgba(30, 41, 59, 0.8);
      color: #94a3b8; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .panel-close:active { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    /* Touch hint */
    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; color: rgba(148, 163, 184, 0.5);
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #hint.hidden { opacity: 0; }

    /* Swipe indicator */
    #swipe-indicator {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 4px; height: 60px; border-radius: 2px;
      background: rgba(56, 189, 248, 0.3);
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none;
    }
    #swipe-indicator.left { left: 8px; }
    #swipe-indicator.right { right: 8px; }
    #swipe-indicator.visible { opacity: 1; }
  </style>
</head>
<body>
  <img id="frame" alt="">

  <!-- Touch hint (fades after 5s) -->
  <div id="hint">Tap anywhere to open controls</div>

  <!-- Swipe indicators -->
  <div id="swipe-indicator" class="left"></div>
  <div id="swipe-indicator" class="right"></div>

  <!-- Overlay panel -->
  <div id="overlay">
    <button class="panel-close" id="btn-close">&times;</button>
    <div class="panel">
      <div class="panel-title">FrameGo</div>

      <button class="panel-btn" id="btn-admin">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Open Admin UI
      </button>

      <button class="panel-btn" id="btn-reload">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Reload Configuration
      </button>

      <button class="panel-btn danger" id="btn-sleep">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        Sleep Display
      </button>

      <div class="panel-status" id="status-list"></div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const frame = document.getElementById("frame");
    const overlay = document.getElementById("overlay");
    const hint = document.getElementById("hint");
    const statusList = document.getElementById("status-list");
    const pending = new Image();
    let refreshInterval = 1000;
    let hideTimer = null;
    let overlayVisible = false;
    let sleeping = false;

    // --- Snapshot polling ---
    pending.onload = () => { frame.src = pending.src; };
    pending.onerror = () => setTimeout(snapshot, 2000);

    function snapshot() {
      if (sleeping) return;
      pending.src = "/api/snapshot?t=" + Date.now() + (token ? "&token=" + encodeURIComponent(token) : "");
    }

    async function init() {
      const headers = {};
      if (token) headers["X-FrameGo-Token"] = token;
      try {
        const res = await fetch("/api/config", { headers });
        const cfg = await res.json();
        if (cfg && cfg.display && cfg.display.fps > 0) {
          refreshInterval = Math.max(250, 1000 / cfg.display.fps);
        }
      } catch (_) {}
      snapshot();
      setInterval(snapshot, refreshInterval);
      setInterval(fetchStatus, 5000);
      fetchStatus();

      // Fade hint after 5s
      setTimeout(() => hint.classList.add("hidden"), 5000);
    }

    // --- Status ---
    async function fetchStatus() {
      const headers = {};
      if (token) headers["X-FrameGo-Token"] = token;
      try {
        const res = await fetch("/api/status", { headers });
        if (!res.ok) return;
        const data = await res.json();
        statusList.innerHTML = "";
        for (const s of data) {
          const row = document.createElement("div");
          row.className = "status-row";
          const dotClass = s.state === "active" ? "active" : s.state === "faulted" ? "faulted" : "suspended";
          row.innerHTML = '<span class="status-dot ' + dotClass + '"></span><span>' + s.name + '</span><span style="margin-left:auto;font-family:monospace;font-size:11px">' + s.state + '</span>';
          statusList.appendChild(row);
        }
      } catch (_) {}
    }

    // --- Overlay toggle ---
    function showOverlay() {
      if (overlayVisible) return;
      overlayVisible = true;
      overlay.classList.add("visible");
      hint.classList.add("hidden");
      resetHideTimer();
    }

    function hideOverlay() {
      overlayVisible = false;
      overlay.classList.remove("visible");
      clearTimeout(hideTimer);
    }

    function resetHideTimer() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideOverlay, 8000);
    }

    // --- Touch / click handling ---
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

    document.addEventListener("touchstart", (e) => {
      if (overlayVisible) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      if (overlayVisible) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const dt = Date.now() - touchStartTime;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Tap (short, small movement) — toggle overlay
      if (dt < 300 && dist < 30) {
        showOverlay();
        return;
      }

      // Swipe left/right — show swipe indicator
      if (dt < 500 && dist > 60 && Math.abs(dx) > Math.abs(dy)) {
        const ind = document.getElementById("swipe-indicator");
        ind.className = dx < 0 ? "right visible" : "left visible";
        setTimeout(() => ind.classList.remove("visible"), 400);
      }
    }, { passive: true });

    // Mouse click fallback (desktop / mouse-connected kiosks)
    document.addEventListener("click", (e) => {
      if (overlayVisible) return;
      if (e.target.closest("#overlay")) return;
      showOverlay();
    });

    // Click on overlay backdrop hides it
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) hideOverlay();
    });

    document.getElementById("btn-close").addEventListener("click", hideOverlay);

    // --- Panel buttons ---
    document.getElementById("btn-admin").addEventListener("click", () => {
      window.open("/", "_blank");
      resetHideTimer();
    });

    document.getElementById("btn-reload").addEventListener("click", async () => {
      const headers = {};
      if (token) headers["X-FrameGo-Token"] = token;
      try {
        await fetch("/api/reload", { method: "POST", headers });
        snapshot();
        fetchStatus();
      } catch (_) {}
      resetHideTimer();
    });

    document.getElementById("btn-sleep").addEventListener("click", () => {
      sleeping = !sleeping;
      const btn = document.getElementById("btn-sleep");
      if (sleeping) {
        frame.style.opacity = "0";
        btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg> Wake Display';
      } else {
        frame.style.opacity = "1";
        btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg> Sleep Display';
        snapshot();
      }
      resetHideTimer();
    });

    // --- Keyboard shortcuts (for desktop testing) ---
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { hideOverlay(); return; }
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); showOverlay(); }
    });

    init();
  </script>
</body>
</html>
